name: "Sync upstream and build tagged APK"

# 北京时间早 07:00 = UTC 23:00。
# 职责：同步上游 main 与 v* tag → re-apply 方控补丁（固化进源码树）→ 在 fork 上把 tag 指向补丁版本
#       → 派发 build-and-release.yml 构建 APK。
#
# ★ 为什么不需要 PAT（与 Flutter 旧版完全一致的做法）：
#   方控补丁在 sync 阶段直接复制进 android 源码树 + 改 AndroidManifest.xml，
#   commit 进 fork main。整个流程【不修改 .github/workflows/ 下的任何文件】——
#   build-and-release.yml 保持上游原样，CI checkout tag 时源码树已含补丁，直接编译即可。
#   GITHUB_TOKEN 无权创建/更新 workflow 文件（GitHub 硬限制，加任何 permissions 都绕不过），
#   但只要不碰 workflow 文件，push 普通源码+清单就畅通无阻。因此不需要配置任何额外 token。
#
# GITHUB_TOKEN 创建的 push 不会触发其他工作流，所以最后一步必须走
# workflow_dispatch（GitHub 官方文档明确的例外），不能用 push 指望自动出包。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: "手动 Run 已默认强制构建，此开关保留作兼容，可不勾"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: lynx-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        env:
          UPSTREAM_URL: https://github.com/songloft-org/songloft-player-lynx.git
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM_URL"
          # 关键：绝不能加 --tags。fork 会把构建过的 v* tag 用 `git tag -f`
          # 重新指向补丁 commit 并 force push；上游存在同名 tag 且指向不同 commit。
          # `git fetch --tags` 会试图用上游版本覆盖本地同名 tag，Git 2.20+ 默认
          # 拒绝（would clobber existing tag）导致本步骤 exit 1、整个同步中断。
          # 门禁判断依赖本地 tag 指向补丁版（见 git cat-file 处），因此本地 tag
          # 必须保持 fork 版；上游 tag 清单改用 ls-remote 获取（见 Version gate）。
          git fetch upstream --no-tags --prune

      # 门禁：只有出现 fork 尚未处理的 v* tag，或手动 force_build 时才继续。
      # 「已处理」的判定不是 tag 是否存在，而是该 tag 的 tree 里是否已有补丁 Kotlin——
      # 这样刚 fork 时从上游带过来的同名 tag 不会被误认为已构建。
      - name: Version gate
        id: version_gate
        env:
          # 手动 Run workflow 一律视为强制构建：点 Run 就是想出包，
          # 不能再因为「fork 版本 == 上游最新 tag」被挡掉。只有定时触发才走版本门禁。
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' || inputs.force_build }}
        run: |
          set -euo pipefail
          LOCAL_VERSION=$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')
          UPSTREAM_VERSION=$(git show upstream/main:package.json \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          echo "fork 版本=$LOCAL_VERSION 上游版本=$UPSTREAM_VERSION 强制构建=$FORCE_BUILD"

          # 上游 v* tag。fetch upstream --tags 已把这些 ref 带到本地，
          # 但这里仍以 ls-remote 为准，避免 fork 自身 tag 状态干扰判断。
          UPSTREAM_TAGS=$(git ls-remote --tags upstream 'refs/tags/v*' \
            | grep -v '\^{}' | sed 's#.*refs/tags/##' | sort -V)
          LATEST_UPSTREAM_TAG=$(printf '%s\n' "$UPSTREAM_TAGS" | grep -v '^$' | tail -1 || true)
          echo "上游 tag: $(printf '%s' "$UPSTREAM_TAGS" | tr '\n' ' ')"
          echo "上游最新 tag=$LATEST_UPSTREAM_TAG"

          if [ "$FORCE_BUILD" = "true" ]; then
            # 手动/强制：直接选上游最新 tag，完全跳过版本比对。
            # 典型场景就是 fork 与上游版本相同、但 fork 里还没有带补丁的包。
            if [ -z "$LATEST_UPSTREAM_TAG" ]; then
              echo "::error::上游没有任何 v* tag，无法构建"
              exit 1
            fi
            NEW_TAGS="$LATEST_UPSTREAM_TAG"
            echo "=== 强制构建模式：选用 $NEW_TAGS ==="
          else
            # 定时：只处理比 fork 版本新的 tag，避免历史版本全部重构建。
            NEW_TAGS=""
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              tag_version=${tag#v}
              LATEST=$(printf '%s\n%s\n' "$LOCAL_VERSION" "$tag_version" | sort -V | tail -1)
              if [ "$tag_version" = "$LOCAL_VERSION" ] || [ "$LATEST" != "$tag_version" ]; then
                echo "  $tag 不比 fork 版本新，跳过"
                continue
              fi
              if git cat-file -e "refs/tags/$tag:android/app/src/main/java/org/songloft/lynx/Leapmotor24Wheel.kt" 2>/dev/null; then
                echo "  $tag 已指向补丁版本，跳过"
                continue
              fi
              echo "  $tag 是待处理的新 tag"
              NEW_TAGS="$NEW_TAGS $tag"
            done <<< "$UPSTREAM_TAGS"
            echo "=== 定时模式：待处理 tag =${NEW_TAGS:- 无} ==="
          fi

          echo "new_tags=$NEW_TAGS" >> "$GITHUB_OUTPUT"
          LATEST_TAG=$(printf '%s\n' $NEW_TAGS | grep -v '^$' | tail -1 || true)
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

          if [ -z "$NEW_TAGS" ]; then
            echo "=== 没有需要处理的 tag，跳过合并 / 推送 / 构建 ==="
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      # 合并策略同 Flutter 旧版：冲突一律取上游（-X theirs），再把补丁重新打回去。
      # 这样上游对 Manifest / package.json 的改动自动并入，而我方补丁随后 re-apply 覆盖。
      #
      # ★ 关键：merge 会把上游对 .github/workflows/ 的改动也带进来，但 GITHUB_TOKEN 是
      #   GitHub App，无权创建/更新 workflow 文件（无 workflows 权限），push 会被拒。
      #   因此 merge 后必须把 .github/ 与 patch/ 整体还原为 fork 版本：
      #   - workflow 保持 fork 现状，push 时对 .github/workflows/ 零改动 → 权限红线不触发；
      #   - 其余源码/配置正常同步上游，补丁由下一步 --apply-source 重新打回源码树。
      - name: "Merge upstream main (conflict: prefer upstream)"
        if: steps.version_gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          # 记录 merge 前的 fork HEAD，作为 .github/patch 的还原基准。
          FORK_HEAD=$(git rev-parse HEAD)
          if ! git merge -X theirs --no-edit upstream/main; then
            echo "::error::合并上游出现无法自动解决的冲突（非内容级），已回滚。"
            git merge --abort 2>/dev/null || true
            exit 1
          fi
          # 把 .github/ 与 patch/ 恢复成 fork 自己的版本：
          # 先从 index + 工作区彻底移除（含上游新增的文件），再从 FORK_HEAD 检出。
          git rm -r -f --cached .github patch
          rm -rf .github patch
          git checkout "$FORK_HEAD" -- .github patch
          echo "=== 已合并上游 main（冲突取上游）；.github/ 与 patch/ 已还原为 fork 版本 ==="

      # ★ 关键：只 re-apply 源码树，绝不改 .github/workflows/ 下的文件。
      # 构建工作流保持上游原样；CI checkout tag 时源码树已含方控补丁，直接编译。
      - name: Re-apply steering patch to source tree
        if: steps.version_gate.outputs.skip != '1'
        run: python3 patch/inject_leapmotor.py --apply-source

      - name: Commit fork changes
        if: steps.version_gate.outputs.skip != '1'
        id: commit
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "=== fork main 无额外改动 ==="
          else
            git commit -m "chore: 同步上游并重新应用零跑方控补丁"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main
        if: steps.version_gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          git push origin main
          echo "=== 已推送 fork main ==="

      # 把 fork 的 tag 重新指向带补丁的 main HEAD，再触发构建。
      # 这样 CI checkout tag 时拿到的就是补丁版本，而不是上游原版。
      - name: Move tags to patched HEAD and dispatch builds
        if: steps.version_gate.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAGS: ${{ steps.version_gate.outputs.new_tags }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAGS="$NEW_TAGS"
          if [ -z "$TAGS" ]; then
            # 门禁已决定跳过，正常路径不会到这里；到这里说明前后逻辑不一致，
            # 明确失败，避免再出现「工作流显示成功但没出包」的静默情况。
            echo "::error::门禁未产出 new_tags，无法派发构建"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          for tag in $TAGS; do
            echo "--- 处理 tag $tag -> $HEAD_SHA ---"
            git tag -f "$tag" "$HEAD_SHA"
            git push --force origin "refs/tags/$tag"
            # 刚 push 的 tag 可能还没被 Actions API 索引，失败时短暂重试
            DISPATCHED=0
            for attempt in 1 2 3; do
              # 派发 fork 自建的「只构建安卓」workflow，不碰上游的全平台
              # build-and-release.yml（它会连带 iOS / HarmonyOS 签名校验而失败）。
              if gh workflow run build-android.yml \
                   --repo "$REPOSITORY" --ref "$tag" 2>/dev/null; then
                DISPATCHED=1
                break
              fi
              echo "第 $attempt 次派发失败，等待 Actions API 索引后重试"
              sleep 5
            done
            if [ "$DISPATCHED" != "1" ]; then
              echo "::error::无法派发 $tag 的构建，请到 Actions 页面手动触发"
              exit 1
            fi
            echo "已派发构建：$tag"
          done

      - name: Abort unfinished merge on failure
        if: failure()
        run: |
          git merge --abort 2>/dev/null || true
          echo "::warning::同步失败，已回滚未完成的合并状态"
